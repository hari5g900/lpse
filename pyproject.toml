[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpse"
version = "1.0.0"
description = "Low-latency semantic state estimator (LPSE) for dynamic network monitoring and orchestration — I-JEPA-style latent predictive learning over streaming telemetry"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "requests>=2.31",
    "psutil>=5.9",
    "xgboost>=2.0",
    "kubernetes>=29.0",
    "sentence-transformers>=3.0",
    "transformers==4.57.6",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lpse-train = "train_lpse:main"
lpse-train-offline = "train_lpse_offline:main"
lpse-train-no-future = "train_lpse_no_future:main"
lpse-infer = "infer_lpse:main"
lpse-benchmark-llm = "benchmark_llm_forecast:main"
lpse-baseline-mlp = "train_baseline_mlp:main"
lpse-baseline-lstm = "train_baseline_lstm:main"
lpse-baseline-transformer = "train_baseline_transformer:main"
lpse-baseline-xgb = "train_baseline_xgb:main"

[tool.setuptools]
packages = ["lpse"]
py-modules = [
    "infer_lpse",
    "train_lpse",
    "train_lpse_offline",
    "train_lpse_no_future",
    "benchmark_llm_forecast",
    "train_baseline_mlp",
    "train_baseline_lstm",
    "train_baseline_transformer",
    "train_baseline_xgb",
]
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_mc_vote.py" = ["E402"]
